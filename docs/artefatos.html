Desktop (sobe o servidor sozinha) ✅\r\n- 3.3 Contexto por hub (edge, doutorado, side-projects, consultoria-dados, consultoria-n8n, pessoal) ✅\r\n\r\n## 4. Interface web ✅\r\n- 4.1 Port das telas originais (Dia, Inbox, Lanes, Projetos, Revisões, Roda, Fluxo, Saúde, Meds, Links) ✅\r\n- 4.2 Telas novas: alertas, edição de projetos/etapas/kanban, processados, atividade, Integrações ✅\r\n- 4.3 Verificação no navegador (desktop e celular 375px, sem rolagem horizontal) ✅\r\n- 4.4 Ditado por voz (🎤 na captura e na Ingestão geral; \"próximo item\" e \"hashtag \u003chub>\"; sem suporte → Win + H) ✅ testado com fala simulada; microfone real a confirmar no Chrome/Edge\r\n- 4.5 Tela de login: dono único por e-mail (fora do código), senha scrypt, sessão em cookie, bloqueio após 5 erros, `npm run senha`; token só para integrações ✅ 9 testes\r\n\r\n## 5. Qualidade e entrega ✅\r\n- 5.1 Testes automatizados de ponta a ponta (42/42 passando: API, ingestão geral, ligação e login) ✅\r\n- 5.5 Repositório público no GitHub com dados de exemplo (dados reais só em `data/`, fora do git) 🔄\r\n- 5.2 README + guias de integração (Gmail Apps Script, Lovable, n8n, GitHub) ✅\r\n- 5.3 Dockerfile + roteiro de publicação (HTTPS, para claude.ai e Lovable) ✅ (build não testado: Docker não verificado nesta máquina)\r\n- 5.4 Repositório git inicial (branch main, primeiro commit) ✅\r\n\r\n## 6. Próximos passos (fora do escopo atual) ⏳\r\n- 6.1 Publicar com HTTPS: Cloudflare Tunnel no PC (gtd.\u003cdomínio>), GTD e túnel iniciando com o Windows (`scripts/iniciar.ps1`) ✅ testado de fora: login exigido, criação de senha recusada pela internet\r\n- 6.2a MCP conectado ao Claude Code (escopo usuário, ponte stdio com partida automática) ✅\r\n- 6.2b Claude Desktop e instruções `gtd_context hub=…` em cada projeto do Claude ⏳\r\n- 6.3 Configurar as fontes (Apps Script do Gmail, webhooks do GitHub, fluxo n8n do WhatsApp)\r\n\r\n## 7. Ligação estruturada com o Diário do Doutorado 🔄\r\nDois sistemas independentes (GTD = execução, Diário = pesquisa), ligados por contrato de mensagens.\r\nPlano: `docs/plano-integracao-diario.html` (https://claude.ai/artifact/Uv1ViLwctzk9dfXT1UbqSb)\r\n- L1 Contrato de ligação v1 (acao.upsert, acao.concluida, marco.status, bloqueio.*, captura.enviada; chaves, dono, conflito) ✅ `docs/contrato-ligacao.md`, `server/link-contract.mjs`\r\n- L2 Ponta do GTD (registro de ligações, /api/link/sync, gtd_link_sync, gtd_links, painel \"No Diário\", balde Aguardando, \"→ Diário\", log) ✅ `server/link.mjs` · 17 testes\r\n- L3 Ponta do Diário (caixa de saída, botão Sincronizar com GTD, log) ⏳\r\n- L4 Publicar o GTD com HTTPS + conector no claude.ai ⏳ decisão sua\r\n- L5 Troca de tipo de controle no GTD (Lista, Etapas, Kanban, EAP simples) ⏳ independente\r\n","alterado":"2026-10-28T17:00:25.514Z","ultimoCommit":"697e45b·2026-10-28"},{"id":"readme","grupo":"Gestão","titulo":"README","arquivo":"README.md","tipo":"md","conteudo":"# ⚙ GTD Framework\r\n\r\nSeu GTD pessoal como sistema web: inbox alimentada por várias fontes, 3 lanes com limite de WIP,\r\ntarefas do dia com carry-over automático, cadências de revisão, Roda da Vida, saúde, medicação e links.\r\nConecta ao **Claude** (MCP) e a outros apps (**Lovable**, n8n, GitHub, Gmail…) via API REST e webhooks.\r\n\r\n- **Sem dependências**: só Node.js ≥ 22.13 (usa `node:sqlite` embutido). Nada de `npm install`.\r\n- **Dados**: `data/gtd.db` (SQLite). Configuração (e-mail do dono, senha em hash, token das integrações): `data/config.json`. Os dois ficam fora do git.\r\n- **Projeto isolado**: não depende de nenhuma outra pasta.\r\n\r\n## Rodar\r\n\r\n```bash\r\nnpm start\r\n```\r\n\r\nAbra http://127.0.0.1:4317. No primeiro acesso, **neste computador**, a tela pede o e-mail do dono e uma senha nova.\r\n\r\n## Acesso e login\r\n\r\n- **Só um dono.** Defina o e-mail em `data/config.json` (`\"owner_email\"`) ou na variável `GTD_OWNER_EMAIL` antes do primeiro acesso. Outro e-mail não entra.\r\n- **Senha** com pelo menos 10 caracteres, guardada como hash scrypt. A criação só é aceita no próprio computador; por túnel ou proxy, não.\r\n- **Sessão** em cookie HttpOnly e SameSite=Strict, válida por 30 dias. Pedidos de outros sites com o cookie são recusados. **Sair** fica no topo.\r\n- **5 tentativas erradas** bloqueiam aquele endereço por 15 minutos.\r\n- **Esqueceu a senha?** Rode `npm run senha` no computador do GTD e reinicie o servidor. Isso também encerra todas as sessões.\r\n- **Integrações** (Claude/MCP, webhooks, Lovable, bookmarklet) continuam usando o **token**, que aparece na tela **Conectar** depois de entrar.\r\nNa primeira execução a base é criada com os dados do artifact original (projetos, inbox, tarefas, cadências, links).\r\nPara começar vazio: `GTD_SEED=0 npm start`.\r\n\r\nPara migrar o que estava no artifact: no artifact antigo, clique em **Backup** e depois, aqui, em\r\n**Revisões → Importar JSON**.\r\n\r\n```bash\r\nnpm test\r\n```\r\n\r\n## Como o fluxo funciona\r\n\r\n```\r\nCaptura ──► Clarificação ──► Organização ──► Reflexão ──► Execução\r\n(fontes)    (inbox: projeto,   (3 lanes, WIP,   (cadências    (tarefas do dia,\r\n             tarefa, feito,     modos, ciclo     D/S/M/T com   3 períodos,\r\n             algum dia, ref,    de vida)         registro)     carry-over)\r\n             lixo)\r\n```\r\n\r\nRegras aplicadas pelo servidor (valem para a UI, para o Claude e para qualquer app):\r\n- WIP: Sustento 2 · Paralelos 3 · Sandbox 2 · global 7 (ativar acima disso exige `force`).\r\n- Até 7 tarefas por dia (alerta quando passa).\r\n- Tarefa não concluída vai sozinha para o dia seguinte e acumula dias de carry-over; com 3 ou mais dias, um alerta pede para quebrar, delegar ou descartar.\r\n- Projeto pausado há mais de 60 dias gera alerta; abandonar pede post-mortem.\r\n- Revisões atrasadas aparecem como alerta.\r\n\r\n## Arquitetura\r\n\r\n```\r\n Gmail · GitHub · Keep · WhatsApp/n8n · Lovable · bookmarklet · UI · Claude\r\n                 │  REST /api/*   ·   MCP /mcp   ·   /capture\r\n                 ▼\r\n        server/index.mjs ── server/store.mjs ── SQLite (data/gtd.db)\r\n                 │ cada mudança vira um evento (tabela events)\r\n                 ├──► UI web em tempo real (SSE /api/stream)\r\n                 ├──► Claude (gtd_context, gtd_activity…)\r\n                 └──► webhooks de saída (n8n, Lovable/Supabase…)\r\n```\r\n\r\n| Pasta | Conteúdo |\r\n|---|---|\r\n| `server/` | HTTP, regras/dados, ingestão, MCP, OpenAPI |\r\n| `public/` | interface web (mesmo visual do artifact) |\r\n| `mcp/stdio-bridge.mjs` | ponte para o Claude Desktop |\r\n| `integrations/` | Gmail Apps Script, Lovable, fontes (n8n, GitHub, WhatsApp) |\r\n| `test/` | testes de ponta a ponta |\r\n| `docs/` | contrato de ligação, esquema JSON e plano de integração (HTML) |\r\n| `EAP.md` | estrutura analítica e status do projeto |\r\n\r\n## Conectar ao Claude\r\n\r\n**Claude Code** (uma vez; vale para todos os projetos):\r\n\r\n```bash\r\nclaude mcp add --transport http gtd http://127.0.0.1:4317/mcp --header \"Authorization: Bearer SEU_TOKEN\"\r\n```\r\n\r\n**Claude Desktop**: em `claude_desktop_config.json`:\r\n\r\n```json\r\n{ \"mcpServers\": { \"gtd\": { \"command\": \"node\", \"args\": [\"C:/caminho/para/gtd-framework/mcp/stdio-bridge.mjs\"] } } }\r\n```\r\n\r\nA ponte lê o token de `data/config.json` e inicia o servidor se ele não estiver rodando.\r\n\r\n**claude.ai (conector personalizado)**: depende do servidor publicado com HTTPS. Use a URL\r\n`https://seu-gtd/mcp?token=SEU_TOKEN`.\r\n\r\nFerramentas: `gtd_context` (comece por ela), `gtd_capture`, `gtd_inbox`, `gtd_process`, `gtd_projects`,\r\n`gtd_project_update`, `gtd_project_create`, `gtd_today`, `gtd_task_add`, `gtd_task_update`, `gtd_review`,\r\n`gtd_activity`, `gtd_link_sync`, `gtd_links`. Prompts: `abertura_diaria`, `fechamento_diario`, `processar_inbox`, `revisao_semanal`.\r\n\r\n**Hubs**: cada projeto e item pertence a um hub (`edge`, `doutorado`, `side-projects`, `consultoria-dados`,\r\n`consultoria-n8n`, `pessoal`). Nas instruções de cada projeto do Claude, coloque por exemplo:\r\n*\"No início da conversa, chame gtd_context com hub=doutorado e capture pendências com gtd_capture.\"*\r\n\r\n## Ingestão geral (vários itens de uma vez)\r\n\r\nNa **Inbox → 📥 Ingestão geral**, cole qualquer bloco de texto ou carregue arquivos `.txt`, `.md`, `.csv` ou `.json`.\r\nClique em **Pré-visualizar**, confira e depois **Capturar**.\r\n\r\n- Uma linha = um item (listas `-`, `*`, `1.` e `[ ]` aceitas). No modo **blocos**, uma linha em branco separa os itens: a 1ª linha vira o título e as demais, as notas.\r\n- O primeiro link de cada item vai para o campo de link. Parâmetros de rastreio (`utm_…`) e âncoras são removidos, e o mesmo link não entra duas vezes.\r\n- Link sozinho na linha: com **Buscar o título dos links** marcado, o GTD lê o título da página (até 20 links por vez).\r\n- `#doutorado`, `#edge`, `#pessoal`… definem o hub. Um título `## Doutorado` vale para os itens abaixo dele.\r\n- `- [x]` (já feito) é ignorado.\r\n\r\nPela API: `POST /api/ingest/geral` com `{\"text\": \"...\", \"mode\": \"linhas|blocos\", \"hub\": \"...\", \"source\": \"...\", \"titulos\": true, \"dry\": true}`\r\n(`dry: true` só mostra a prévia). No Claude: `gtd_capture` com o parâmetro `texto`.\r\n\r\n## Entrada por voz\r\n\r\n- **No GTD (Chrome ou Edge):** clique em 🎤 ao lado do campo de captura e fale; aperte Enter para capturar.\r\n  Na **Ingestão geral**, clique em **🎤 Ditar** e fale vários itens: diga **\"próximo item\"** para começar outro\r\n  e **\"hashtag doutorado\"** (edge, pessoal…) para escolher o hub. Clique de novo para parar e depois em Pré-visualizar.\r\n  O navegador pede permissão do microfone na primeira vez. O reconhecimento é do próprio navegador (o Chrome usa os\r\n  servidores do Google; o Edge, os da Microsoft) e precisa de internet.\r\n- **Em qualquer navegador no Windows:** clique no campo e aperte **Win + H** (ditado do Windows).\r\n- **Celular:** use o microfone do teclado. Com o GTD publicado em HTTPS, atalhos da Siri ou do Google Assistente\r\n  podem abrir `/capture?text=...&token=...` e mandar a fala direto para a inbox.\r\n\r\n## Ligação com o Diário do Doutorado\r\n\r\nGTD e Diário são sistemas separados, ligados pelo contrato `gtd-link/1` (`docs/contrato-ligacao.md`).\r\nO Diário envia ações, status de EAP/gates e bloqueios; o GTD devolve conclusões e capturas.\r\n\r\n- Ligue um projeto a uma referência do Diário: no projeto, **No Diário → Ligar referência** (ex.: `dd:eap:bib:4`, `dd:gate:G3`), ou `POST /api/links`.\r\n- Ações do Diário entram na Inbox (origem Diário, com prazo); as de outras pessoas vão para **Aguardando**.\r\n- Concluir a tarefa gera `acao.concluida`, que fica pendente até o Diário confirmar.\r\n- Itens do hub doutorado podem ser enviados ao Diário (**→ Diário**) como rascunho de entrada.\r\n- Sincronização: `POST /api/link/sync` ou a ferramenta MCP `gtd_link_sync`; log em **Conectar**.\r\n\r\n## Conectar outros apps\r\n\r\n- **REST + OpenAPI**: `GET /api/openapi.json` (Lovable, GPT Actions, Postman, n8n).\r\n- **Lovable**: veja `integrations/lovable.md` (Edge Function com o token guardado como segredo).\r\n- **Fontes**: veja `integrations/fontes.md` (Gmail, GitHub, Keep, WhatsApp/n8n, bookmarklet).\r\n- **Webhooks de saída**: na tela **Conectar**.\r\n\r\n## Publicar no seu PC com Cloudflare Tunnel (sem abrir portas)\r\n\r\nPré-requisitos: um domínio na Cloudflare (servidores DNS apontados para ela) e o PC ligado.\r\n\r\n1. Instale o `cloudflared` (no Windows: `winget install --id Cloudflare.cloudflared`).\r\n2. `cloudflared tunnel login` → no navegador, escolha o domínio e clique em **Authorize**.\r\n3. `cloudflared tunnel create gtd`\r\n4. `cloudflared tunnel route dns gtd gtd.seudominio.com.br`\r\n5. Crie `~/.cloudflared/config.yml`:\r\n   ```yaml\r\n   tunnel: \u003cid do túnel>\r\n   credentials-file: C:\\Users\\\u003cvocê>\\.cloudflared\\\u003cid do túnel>.json\r\n   ingress:\r\n     - hostname: gtd.seudominio.com.br\r\n       service: http://127.0.0.1:4317\r\n       originRequest:\r\n         httpHostHeader: gtd.seudominio.com.br\r\n     - service: http_status:404\r\n   ```\r\n6. **Iniciar com o Windows:** coloque na pasta Inicializar (`Win + R` → `shell:startup`) um atalho que rode\r\n   `powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File \u003cpasta>\\scripts\\iniciar.ps1`.\r\n   O script sobe o GTD e o túnel sem janelas, só se ainda não estiverem rodando, e grava logs em `data/logs/`.\r\n\r\nO servidor continua ouvindo só em `127.0.0.1`. O túnel é quem leva o tráfego até ele. Pela internet não dá para\r\ncriar a senha (só no próprio PC), e a interface exige login. Desative a suspensão do PC para o site não sair do ar.\r\n\r\n## Publicar (para claude.ai, Lovable, Gmail e GitHub alcançarem o servidor)\r\n\r\nOpção rápida, com o servidor rodando no seu computador (túnel HTTPS):\r\n\r\n```bash\r\ncloudflared tunnel --url http://127.0.0.1:4317\r\n```\r\n\r\nOpção permanente, com Docker em Render, Railway ou Fly.io (monte um volume em `/data`):\r\n\r\n```bash\r\ndocker build -t gtd-framework .\r\n```\r\n\r\n```bash\r\ndocker run -p 4317:4317 -v gtd-data:/data -e GTD_TOKEN=um-token-longo gtd-framework\r\n```\r\n\r\nVariáveis: `PORT` (4317), `HOST` (127.0.0.1; use 0.0.0.0 em contêiner), `GTD_DATA` (pasta de dados),\r\n`GTD_TOKEN` (sobrepõe o token salvo), `GTD_TZ` (America/Sao_Paulo), `GTD_CORS` (origens permitidas, padrão `*`),\r\n`GTD_GITHUB_SECRET` (valida webhooks do GitHub), `GTD_SEED=0` (base vazia).\r\n\r\n> Com o servidor público, o token é a única proteção: use um valor longo e não o coloque em código de front-end.\r\n\r\n## API — principais rotas\r\n\r\n| Método | Rota | Uso |\r\n|---|---|---|\r\n| GET | `/api/context?hub=&format=md\\|json` | resumo do que está em andamento |\r\n| GET/POST | `/api/items` | listar / capturar |\r\n| POST | `/api/items/:id/process` | clarificar (`projeto`, `tarefa`, `feito`, `someday`, `reference`, `trash`, `inbox`) |\r\n| POST | `/api/ingest/:fonte` | ingestão por fonte |\r\n| GET/POST/PATCH/DELETE | `/api/projects[/:id]` | projetos (id ou parte do nome) |\r\n| GET | `/api/today` | tarefas do dia por período |\r\n| GET/POST/PATCH/DELETE | `/api/tasks[/:id]` | tarefas |\r\n| GET/POST | `/api/reviews[/:cadência]` | revisões |\r\n| GET | `/api/events?since=` | log de atividade |\r\n| GET | `/api/stream` | eventos em tempo real (SSE) |\r\n| GET/POST | `/api/export`, `/api/import` | backup |\r\n| POST | `/mcp` | servidor MCP |\r\n","alterado":"2026-10-28T17:00:25.514Z","ultimoCommit":"697e45b·2026-10-28"},{"id":"plano","grupo":"Gestão","titulo":"Plano de integração com o Diário","arquivo":"docs/plano-integracao-diario.html","tipo":"link","url":"https://claude.ai/artifact/Uv1ViLwctzk9dfXT1UbqSb","conteudo":"","alterado":"2026-10-28T13:30:41.609Z","ultimoCommit":"697e45b·2026-10-28"},{"id":"contrato","grupo":"Ligação com o Diário","titulo":"Contrato gtd-link/1","arquivo":"docs/contrato-ligacao.md","tipo":"md","conteudo":"# Contrato de ligação `gtd-link/1`\r\n\r\nLiga o **GTD** (dono da execução) a sistemas externos, começando pelo **Diário do Doutorado** (dono da pesquisa).\r\nOs dois continuam independentes: nenhum lê o banco do outro. Eles trocam só as mensagens abaixo.\r\n\r\n- Validador: `server/link-contract.mjs` · Esquema JSON: `docs/contrato-ligacao.schema.json`\r\n- Rota: `POST /api/link/sync` · Ferramenta MCP: `gtd_link_sync`\r\n\r\n## Envelope\r\n\r\n```json\r\n{\r\n  \"contrato\": \"gtd-link/1\",\r\n  \"tipo\": \"acao.upsert\",\r\n  \"chave\": \"dd:acao:7f3a\",\r\n  \"alterado_em\": \"2026-10-17T14:20:00Z\",\r\n  \"ligado_a\": \"dd:eap:bib:4_2_3\",\r\n  \"dados\": { }\r\n}\r\n```\r\n\r\n| Campo | Regra |\r\n|---|---|\r\n| `contrato` | sempre `gtd-link/1` |\r\n| `tipo` | um dos 6 tipos abaixo |\r\n| `chave` | identificador estável no sistema dono (formato por tipo) |\r\n| `alterado_em` | data-hora ISO 8601 com fuso; decide conflitos |\r\n| `ligado_a` | opcional: nó de EAP (`dd:eap:\u003cárvore>:\u003ccódigo com _>`) ou gate (`dd:gate:\u003cid>`) |\r\n| `dados` | campos do tipo |\r\n\r\n## Tipos\r\n\r\n| Tipo | Enviado por | Dono | `chave` | `dados` | Efeito no destino |\r\n|---|---|---|---|---|---|\r\n| `acao.upsert` | Diário | Diário | `dd:acao:\u003cid>` | `texto`*, `responsavel`, `prazo` (AAAA-MM-DD), `estado` (aberta, feita, cancelada) | Responsável \"eu\" (ou vazio): item na **Inbox** do GTD (origem Diário, prazo nas notas). Outro responsável: balde **Aguardando**. `feita`/`cancelada`: fecha o que existir no GTD. |\r\n| `acao.concluida` | GTD | GTD | `dd:acao:\u003cid>` | `concluida_em`* | O Diário marca a ação como feita |\r\n| `marco.status` | Diário | Diário | `dd:eap:…` ou `dd:gate:…` | `titulo`*, `status`, `progresso` (0–100), `decisao`, `gate_em_foco`, `proximo_marco`, `pendencias` | Painel \"No Diário\" (somente leitura) nos projetos ligados a essa referência |\r\n| `bloqueio.aberto` | Diário | Diário | `dd:bloqueio:\u003cid>` | `texto`* | Alerta no GTD (hub do projeto ligado, ou doutorado) |\r\n| `bloqueio.fechado` | Diário | Diário | `dd:bloqueio:\u003cid>` | — | Encerra o alerta |\r\n| `captura.enviada` | GTD | Diário | `gtd:item:\u003cid>` | `texto`*, `notas`, `url` | Rascunho de entrada no Diário; só vira registro quando você confirma lá |\r\n\r\n\\* obrigatório\r\n\r\n## Regras\r\n\r\n1. **Dono decide.** Cada tipo só é aceito de quem o envia na tabela; o resto é recusado com motivo.\r\n2. **Idempotência.** A mesma `chave` com o mesmo `alterado_em` (ou mais antigo) não muda nada: resultado `ignorado`.\r\n3. **Conflito.** Vale o `alterado_em` mais recente do dono. O GTD guarda o último aplicado por chave.\r\n4. **Ações seguem o fluxo GTD.** Uma ação do Diário entra na Inbox; você a clarifica (normalmente em tarefa). Quando a tarefa é concluída, ou o item é marcado \"feito\", o GTD gera `acao.concluida`. Reabrir a tarefa, descartar o item ou mandá-lo para Algum Dia não é propagado: cancelar uma ação é decisão do Diário.\r\n5. **Sem eco.** Quando o Diário diz que a ação está feita, o GTD fecha a tarefa sem gerar `acao.concluida` de volta.\r\n6. **Entrega garantida.** Mensagens do GTD ficam na caixa de saída e voltam em toda sincronização até o Diário confirmá-las por `id` em `confirmados`.\r\n7. **Ligações.** Um projeto do GTD liga-se a uma ou mais referências do Diário. `ligado_a` cobre descendentes: `dd:eap:bib:4` cobre `dd:eap:bib:4_2_3`. Vale a ligação mais específica.\r\n\r\n## Sincronização\r\n\r\nRequisição (Diário → GTD):\r\n\r\n```json\r\n{ \"sistema\": \"diario\",\r\n  \"mensagens\": [ { \"contrato\": \"gtd-link/1\", \"tipo\": \"acao.upsert\", \"...\": \"...\" } ],\r\n  \"confirmados\": [12, 13] }\r\n```\r\n\r\nResposta:\r\n\r\n```json\r\n{ \"contrato\": \"gtd-link/1\",\r\n  \"aplicadas\": [ { \"chave\": \"dd:acao:7f3a\", \"tipo\": \"acao.upsert\", \"resultado\": \"criado\", \"gtd_id\": \"i_9c0e11aa\" } ],\r\n  \"pendentes\": [ { \"id\": 14, \"contrato\": \"gtd-link/1\", \"tipo\": \"acao.concluida\", \"chave\": \"dd:acao:7f3a\", \"alterado_em\": \"…\", \"dados\": { \"concluida_em\": \"…\" } } ],\r\n  \"servidor_em\": \"2026-10-18T09:00:00Z\" }\r\n```\r\n\r\n`resultado`: `criado`, `atualizado`, `ignorado` (repetida ou mais antiga) ou `recusado` (com `motivo`).\r\nTudo fica no log de ligação (`GET /api/link/log`).\r\n","alterado":"2026-10-17T14:45:03.141Z","ultimoCommit":"697e45b·2026-10-28"},{"id":"schema","grupo":"Ligação com o Diário","titulo":"Esquema JSON do contrato","arquivo":"docs/contrato-ligacao.schema.json","tipo":"code","lang":"json","conteudo":"{\n  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n  \"$id\": \"gtd-link/1\",\n  \"title\": \"Mensagem do contrato de ligação gtd-link/1\",\n  \"type\": \"object\",\n  \"required\": [\"contrato\", \"tipo\", \"chave\", \"alterado_em\", \"dados\"],\n  \"properties\": {\n    \"contrato\": { \"const\": \"gtd-link/1\" },\n    \"tipo\": { \"enum\": [\"acao.upsert\", \"acao.concluida\", \"marco.status\", \"bloqueio.aberto\", \"bloqueio.fechado\", \"captura.enviada\"] },\n    \"chave\": { \"type\": \"string\" },\n    \"alterado_em\": { \"type\": \"string\", \"format\": \"date-time\" },\n    \"ligado_a\": { \"type\": \"string\", \"pattern\": \"^dd:(eap:[a-z0-9-]{1,20}:\\\\d+(_\\\\d+)*|gate:[A-Za-z0-9-]{1,20})$\" },\n    \"dados\": { \"type\": \"object\" }\n  },\n  \"allOf\": [\n    { \"if\": { \"properties\": { \"tipo\": { \"const\": \"acao.upsert\" } } }, \"then\": { \"properties\": {\n      \"chave\": { \"pattern\": \"^dd:acao:[\\\\w-]{1,80}$\" },\n      \"dados\": { \"required\": [\"texto\"], \"properties\": {\n        \"texto\": { \"type\": \"string\", \"maxLength\": 2000 }, \"responsavel\": { \"type\": \"string\" },\n        \"prazo\": { \"type\": \"string\", \"format\": \"date\" }, \"estado\": { \"enum\": [\"aberta\", \"feita\", \"cancelada\"] } } } } } },\n    { \"if\": { \"properties\": { \"tipo\": { \"const\": \"acao.concluida\" } } }, \"then\": { \"properties\": {\n      \"chave\": { \"pattern\": \"^dd:acao:[\\\\w-]{1,80}$\" },\n      \"dados\": { \"required\": [\"concluida_em\"], \"properties\": { \"concluida_em\": { \"type\": \"string\", \"format\": \"date-time\" } } } } } },\n    { \"if\": { \"properties\": { \"tipo\": { \"const\": \"marco.status\" } } }, \"then\": { \"properties\": {\n      \"chave\": { \"pattern\": \"^dd:(eap:[a-z0-9-]{1,20}:\\\\d+(_\\\\d+)*|gate:[A-Za-z0-9-]{1,20})$\" },\n      \"dados\": { \"required\": [\"titulo\"], \"properties\": {\n        \"titulo\": { \"type\": \"string\" }, \"status\": { \"enum\": [\"pendente\", \"em_andamento\", \"concluido\", \"bloqueado\"] },\n        \"progresso\": { \"type\": \"number\", \"minimum\": 0, \"maximum\": 100 }, \"decisao\": { \"enum\": [\"\", \"go\", \"iterar\", \"pivotar\", \"parar\"] },\n        \"gate_em_foco\": { \"type\": \"string\" }, \"proximo_marco\": { \"type\": \"string\" }, \"pendencias\": { \"type\": \"string\" } } } } } },\n    { \"if\": { \"properties\": { \"tipo\": { \"const\": \"bloqueio.aberto\" } } }, \"then\": { \"properties\": {\n      \"chave\": { \"pattern\": \"^dd:bloqueio:[\\\\w-]{1,80}$\" }, \"dados\": { \"required\": [\"texto\"] } } } },\n    { \"if\": { \"properties\": { \"tipo\": { \"const\": \"bloqueio.fechado\" } } }, \"then\": { \"properties\": {\n      \"chave\": { \"pattern\": \"^dd:bloqueio:[\\\\w-]{1,80}$\" } } } },\n    { \"if\": { \"properties\": { \"tipo\": { \"const\": \"captura.enviada\" } } }, \"then\": { \"properties\": {\n      \"chave\": { \"pattern\": \"^gtd:item:i_[0-9a-f]{8}$\" },\n      \"dados\": { \"required\": [\"texto\"], \"properties\": { \"texto\": { \"type\": \"string\" }, \"notas\": { \"type\": \"string\" }, \"url\": { \"type\": \"string\" } } } } } }\n  ]\n}\n","alterado":"2026-10-17T14:39:02.599Z","ultimoCommit":"697e45b·2026-10-28"},{"id":"fontes","grupo":"Integrações","titulo":"Fontes de captura","arquivo":"integrations/fontes.md","tipo":"md","conteudo":"# Fontes de captura\r\n\r\nTodas as fontes terminam na **Inbox**. Nada é processado automaticamente: a clarificação continua sendo sua\r\n(ou do Claude, com sua confirmação). Itens com o mesmo ID externo (`source_ref`) não são duplicados.\r\n\r\n| Fonte | Como | Endpoint |\r\n|---|---|---|\r\n| UI / celular | campo de captura, tecla `c`, `/?capture=texto` | — |\r\n| Qualquer página web | bookmarklet (tela Conectar) | `GET /capture?text=&url=&token=` |\r\n| Claude (qualquer projeto) | ferramenta `gtd_capture` | `POST /mcp` |\r\n| Gmail | `gmail-apps-script.gs` (marcador \"GTD\") | `POST /api/ingest/gmail` |\r\n| GitHub | webhook do repositório (JSON) | `POST /api/ingest/github?token=` |\r\n| Google Keep / texto | colar lista; 1 linha = 1 item | `POST /api/ingest/keep` (text/plain) |\r\n| WhatsApp | n8n/Evolution/Z-API → HTTP Request | `POST /api/ingest/whatsapp` |\r\n| Lovable | Edge Function (veja `lovable.md`) | `POST /api/items` |\r\n| n8n / Make / Zapier | nó HTTP Request | `POST /api/ingest/n8n` |\r\n| Google Drive | Apps Script ou n8n | `POST /api/ingest/drive` |\r\n\r\nFormato genérico (JSON, item ou lista, ou `{items:[…]}`):\r\n\r\n```json\r\n{ \"text\": \"Título curto\", \"notes\": \"detalhes\", \"url\": \"https://…\", \"hub\": \"doutorado\", \"source_ref\": \"id-externo\" }\r\n```\r\n\r\nParâmetros de URL opcionais em `/api/ingest/*`: `source` (sobrescreve a origem) e `hub` (hub padrão).\r\n\r\n## n8n — WhatsApp para o GTD\r\n\r\n1. Gatilho do seu provedor de WhatsApp (mensagens para você mesmo, ou começando com `gtd:`).\r\n2. **HTTP Request**: POST `https://seu-gtd/api/ingest/whatsapp`, header `Authorization: Bearer \u003ctoken>`,\r\n   corpo JSON `{\"text\": \"{{$json.message}}\", \"source_ref\": \"{{$json.id}}\"}`.\r\n\r\n## GitHub\r\n\r\nRepositório → Settings → Webhooks → Add webhook:\r\n- Payload URL: `https://seu-gtd/api/ingest/github?token=\u003ctoken>`\r\n- Content type: `application/json`\r\n- Eventos: Issues, Pull requests, Pull request reviews, Issue comments, Pushes, Releases, Workflow runs\r\n- Opcional: defina `GTD_GITHUB_SECRET` no servidor e o mesmo valor em \"Secret\" para validar a assinatura.\r\n\r\nO item herda o `hub` do projeto cujo campo GitHub for igual ao repositório (ex.: `usuario/rsl-xai-mas` → doutorado).\r\n","alterado":"2026-10-28T13:29:33.222Z","ultimoCommit":"697e45b·2026-10-28"},{"id":"lovable","grupo":"Integrações","titulo":"Conectar apps Lovable","arquivo":"integrations/lovable.md","tipo":"md","conteudo":"# Conectar apps Lovable ao GTD\n\nO GTD expõe uma API REST com CORS liberado e autenticação por token. Qualquer app Lovable pode\n**capturar** itens na inbox, **ler o contexto** (o que está em andamento) e **reagir a mudanças** (webhooks).\n\n> O app Lovable roda em `https://….lovable.app`. Para ele alcançar o GTD, o servidor precisa estar\n> publicado com HTTPS (veja README → Publicar). `http://127.0.0.1` só funciona enquanto você testa no\n> seu próprio computador.\n\n## 1. Guarde o token como segredo\n\nNão coloque o token no código do front-end publicado. No Lovable, conecte o Supabase e crie uma\n**Edge Function** com os segredos `GTD_URL` e `GTD_TOKEN`; o front chama a função, e a função chama o GTD.\n\n## 2. Prompt pronto para o Lovable\n\n```\nCrie uma Supabase Edge Function chamada \"gtd\" que repassa requisições para a API do meu GTD.\nSegredos: GTD_URL e GTD_TOKEN. A função recebe {action, payload}:\n- action \"capture\": POST {GTD_URL}/api/items com payload {text, notes?, url?, hub?} e source \"Lovable\"\n- action \"context\": GET {GTD_URL}/api/context?format=json&hub={payload.hub}\n- action \"projects\": GET {GTD_URL}/api/projects?status=ativo\nSempre envie o header Authorization: Bearer {GTD_TOKEN}.\nDepois adicione no app um botão \"Enviar para meu GTD\" que chama a função com action \"capture\".\nA especificação completa está em {GTD_URL}/api/openapi.json.\n```\n\n## 3. Edge Function (Deno) — referência\n\n```ts\n// supabase/functions/gtd/index.ts\nconst GTD_URL = Deno.env.get('GTD_URL')!;\nconst GTD_TOKEN = Deno.env.get('GTD_TOKEN')!;\nconst cors = { 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Headers': 'authorization, content-type' };\n\nDeno.serve(async req => {\n  if (req.method === 'OPTIONS') return new Response(null, { headers: cors });\n  const { action, payload = {} } = await req.json();\n  const h = { Authorization: `Bearer ${GTD_TOKEN}`, 'Content-Type': 'application/json' };\n  let r: Response;\n  if (action === 'capture') r = await fetch(`${GTD_URL}/api/items`, { method: 'POST', headers: h, body: JSON.stringify({ ...payload, source: 'Lovable' }) });\n  else if (action === 'context') r = await fetch(`${GTD_URL}/api/context?format=json${payload.hub ? `&hub=${payload.hub}` : ''}`, { headers: h });\n  else if (action === 'projects') r = await fetch(`${GTD_URL}/api/projects?status=ativo`, { headers: h });\n  else return new Response(JSON.stringify({ error: 'ação inválida' }), { status: 400, headers: cors });\n  return new Response(await r.text(), { status: r.status, headers: { ...cors, 'Content-Type': 'application/json' } });\n});\n```\n\n## 4. Receber eventos do GTD no app\n\nNa tela **Conectar → Webhooks de saída**, adicione a URL de uma Edge Function. A cada mudança o GTD envia:\n\n```json\n{ \"event\": \"item.captured\", \"ts\": \"2026-10-17T12:00:00Z\", \"entity_id\": \"i_ab12cd34\", \"summary\": \"Lovable: …\", \"data\": { } }\n```\n\nTipos: `item.captured`, `item.processed`, `item.updated`, `project.created`, `project.updated`,\n`task.created`, `task.updated`, `task.rollover`, `review.done`, `state.updated`, `import.done`.\n","alterado":"2026-10-17T14:03:02.771Z","ultimoCommit":"697e45b·2026-10-28"},{"id":"gmail","grupo":"Integrações","titulo":"Gmail → GTD (Apps Script)","arquivo":"integrations/gmail-apps-script.gs","tipo":"code","lang":"javascript","conteudo":"/**\n * Gmail → GTD Inbox\n * 1. Em https://script.google.com crie um projeto e cole este arquivo.\n * 2. Em \"Configurações do projeto → Propriedades do script\" crie:\n *      GTD_URL   = https://seu-gtd.exemplo.com   (precisa ser público/HTTPS — veja README → Publicar)\n *      GTD_TOKEN = \u003ctoken de data/config.json>\n * 3. No Gmail, crie o marcador \"GTD\" (e use filtros ou marque manualmente).\n * 4. Rode setup() uma vez (autoriza e cria o gatilho de 15 em 15 minutos).\n * E-mails enviados recebem o marcador \"GTD/enviado\" e saem de \"GTD\". Duplicatas são ignoradas pelo servidor.\n */\nconst LABEL = 'GTD';\nconst DONE_LABEL = 'GTD/enviado';\n\nfunction setup() {\n  GmailApp.getUserLabelByName(DONE_LABEL) || GmailApp.createLabel(DONE_LABEL);\n  ScriptApp.getProjectTriggers().forEach(t => ScriptApp.deleteTrigger(t));\n  ScriptApp.newTrigger('pushToGtd').timeBased().everyMinutes(15).create();\n  pushToGtd();\n}\n\nfunction pushToGtd() {\n  const props = PropertiesService.getScriptProperties();\n  const url = props.getProperty('GTD_URL').replace(/\\/$/, '') + '/api/ingest/gmail';\n  const token = props.getProperty('GTD_TOKEN');\n  const label = GmailApp.getUserLabelByName(LABEL);\n  if (!label) return;\n  const done = GmailApp.getUserLabelByName(DONE_LABEL);\n  const threads = label.getThreads(0, 50);\n  if (!threads.length) return;\n  const items = threads.map(t => {\n    const m = t.getMessages()[0];\n    return { subject: t.getFirstMessageSubject(), from: m.getFrom(), snippet: m.getPlainBody().slice(0, 1500),\n      messageId: m.getId(), url: 'https://mail.google.com/mail/u/0/#inbox/' + t.getId() };\n  });\n  const res = UrlFetchApp.fetch(url, { method: 'post', contentType: 'application/json', payload: JSON.stringify(items),\n    headers: { Authorization: 'Bearer ' + token }, muteHttpExceptions: true });\n  if (res.getResponseCode() !== 200) throw new Error('GTD respondeu ' + res.getResponseCode() + ': ' + res.getContentText());\n  threads.forEach(t => { t.addLabel(done); t.removeLabel(label); });\n}\n","alterado":"2026-10-17T14:02:51.614Z","ultimoCommit":"697e45b·2026-10-28"}],"commit":"697e45b","geradoEm":"2026-10-28T17:05:31.188Z"};
(function(){
  'use strict';
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var fmt = function(iso){ try { return new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return iso; } };
  document.getElementById('gen').textContent = 'Gerado em ' + fmt(DATA.geradoEm) + (DATA.commit ? ' · commit ' + DATA.commit : '');
  var groups = [];
  DATA.docs.forEach(function(d){ var g = groups.filter(function(x){ return x.n === d.grupo; })[0]; if (!g) groups.push(g = { n: d.grupo, docs: [] }); g.docs.push(d); });
  var idx = document.getElementById('idx');
  idx.innerHTML = groups.map(function(g){
    return '<div class="grp"><div class="grp-t">' + esc(g.n) + '</div>' + g.docs.map(function(d){
      return '<button class="doc-btn" id="b-' + d.id + '" data-id="' + d.id + '">' + esc(d.titulo) + '</button>'; }).join('') + '</div>';
  }).join('');
  function render(md){
    if (window.marked) { try { return window.marked.parse(md, { mangle: false, headerIds: false }); } catch (e) {} }
    return '<pre class="code">' + esc(md) + '</pre>';
  }
  function show(id){
    var d = DATA.docs.filter(function(x){ return x.id === id; })[0] || DATA.docs[0];
    idx.querySelectorAll('.doc-btn').forEach(function(b){ b.setAttribute('aria-current', String(b.dataset.id === d.id)); });
    var head = '<div class="dochead"><span class="path">' + esc(d.arquivo) + '</span><span><span class="tag' + (d.ultimoCommit === 'não commitado' ? ' warn' : '') + '">' + esc(d.ultimoCommit === 'não commitado' ? 'não commitado' : 'commit ' + d.ultimoCommit) + '</span></span></div>';
    var body;
    if (d.tipo === 'md') body = '<div class="md">' + render(d.conteudo) + '</div>';
    else if (d.tipo === 'code') body = '<pre class="code"><code>' + esc(d.conteudo) + '</code></pre>';
    else body = '<div class="linkcard"><p>Este artefato é uma página interativa própria, com a demonstração de troca do tipo de controle.</p><a href="' + esc(d.url) + '" target="_blank" rel="noopener">Abrir o plano de integração ↗</a><p class="meta">Arquivo local: ' + esc(d.arquivo) + '</p></div>';
    var view = document.getElementById('view');
    view.innerHTML = head + body;
    view.querySelectorAll('.md a[href]').forEach(function(a){ if (/^https?:/.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener'; } });
    try { localStorage.setItem('gtd-artefatos-doc', d.id); } catch (e) {}
  }
  idx.addEventListener('click', function(e){ var b = e.target.closest('.doc-btn'); if (b) { show(b.dataset.id); window.scrollTo(0, 0); } });
  var start = (location.hash || '').slice(1);
  if (!DATA.docs.some(function(d){ return d.id === start; })) { try { start = localStorage.getItem('gtd-artefatos-doc') || 'eap'; } catch (e) { start = 'eap'; } }
  show(start);
})();
</script>
